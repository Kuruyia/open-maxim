version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - sqlclosecheck
    - errorlint
    - nilerr
    - fatcontext
    - noctx
    - revive
    - gocritic
    - modernize
    - nolintlint
    - unconvert
    - copyloopvar
    - thelper
    - testifylint
    - sloglint
    - predeclared
    - containedctx
    - contextcheck
    - dupl
    - forbidigo
    - exhaustive
    - usestdlibvars
    - perfsprint
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    dupl:
      threshold: 50
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the log package instead of printing to stdout
        - pattern: ^log\.(Fatal|Panic).*$
          msg: return an error and let main decide how to exit
      analyze-types: true
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    warn-unused: true
    generated: strict
    rules:
      - path: ^cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    warn-unused: true
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
